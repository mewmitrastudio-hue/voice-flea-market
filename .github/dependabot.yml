version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:23'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
    groups:
      capacitor:
        patterns: ['@capacitor/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:43'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 2
