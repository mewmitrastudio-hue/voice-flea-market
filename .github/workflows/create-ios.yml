name: Create iOS Project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Create iOS project
        run: npx cap add ios

      - name: Commit iOS project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios package-lock.json
          git diff --cached --quiet || git commit -m "Create Capacitor iOS project"
          git push
