name: Distribute reviewed iOS build
run-name: TestFlight reviewed source ${{ github.sha }}
on:
  workflow_dispatch:
  push:
    branches: [codex/receipt-capture-20261029]
    paths: ['.github/workflows/distribute-reviewed-ios.yml']
permissions:
  contents: read
concurrency:
  group: distribute-reviewed-ios
  cancel-in-progress: false
jobs:
  testflight:
    # Allow workflow maintenance without uploading the same app again.
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip testflight]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Require existing Capawesome connection
        env:
          CAPAWESOME_TOKEN: ${{ secrets.CAPAWESOME_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CAPAWESOME_TOKEN" ]; then
            echo "::error::Add CAPAWESOME_TOKEN in this repository's Actions secrets, then rerun this job. Never paste the token in chat."
            exit 1
          fi
      - name: Build and deploy reviewed build 33 source to TestFlight
        env:
          CAPAWESOME_TOKEN: ${{ secrets.CAPAWESOME_TOKEN }}
          REVIEWED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Use the CLI exit status directly; deployment logs are not one JSON document.
          npx -y @capawesome/cli@4.11.0 apps:builds:create \
            --app-id c0e475d8-2fde-404d-8963-89bc436c792b \
            --yes --platform ios --type app-store \
            --git-ref "$REVIEWED_SHA" \
            --certificate "声のフリマ iOS Distribution 2026" \
            --destination "Koe no Furima App Store"
