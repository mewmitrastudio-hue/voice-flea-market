name = "koe-apple-verifier"
main = "index.mjs"
compatibility_date = "2026-10-21"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[alias]
"node-fetch" = "./fetch-compat.mjs"

# Set through encrypted Worker secrets, never in this file:
# APPLE_IAP_PRIVATE_KEY, APPLE_IAP_KEY_ID, APPLE_IAP_ISSUER_ID,
# APPLE_APP_ID, APPLE_VERIFIER_SHARED_SECRET.
# This worker does not receive Supabase database/admin credentials.
